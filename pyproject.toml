[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inflation-base-effects"
version = "0.2.0"
description = "A reproducible cross-country falsification study of inflation base effects"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "statsmodels",
    "cvxpy",
    "openpyxl",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyterlab",
    "nbconvert",
    "ipykernel",
    "ruff",
    "build",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inflation_base_effects"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
